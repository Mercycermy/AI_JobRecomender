services:
  - type: web
    name: ai-job-recommender-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt && python scripts/seed_db.py
    startCommand: python -m app.routes
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "1"
      - key: RATE_LIMIT_ENABLED
        value: "1"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_ACCESS_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: ai-job-recommender-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
